<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyweaver — 창작 워크스페이스</title>
<meta name="description" content="웹소설·장편소설 작가를 위한 원고·캐릭터·설정·메모 통합 창작 워크스페이스">
<meta name="theme-color" content="#8b7bff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script>
  (function () {
    var mode = localStorage.getItem('sw-theme-mode') || 'system';
    var resolved = mode === 'system'
      ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      : mode;
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-style', localStorage.getItem('sw-theme-style') || 'vivid');
    document.documentElement.toggleAttribute('data-sidebar-collapsed', localStorage.getItem('sw-sidebar-collapsed') === 'true');
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand" data-route="#/">
      <span class="brand__mark">✒️</span>
      <span class="brand__name">Storyweaver</span>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="사이드바 접기/펴기">◂</button>
    </div>

    <div class="work-switcher" id="workSwitcher">
      <button class="work-switcher__current" id="workSwitcherBtn">
        <span id="currentWorkColor" class="work-dot"></span>
        <span id="currentWorkTitle">작품을 선택하세요</span>
        <span class="chev">▾</span>
      </button>
      <div class="work-switcher__menu" id="workSwitcherMenu" hidden></div>
    </div>

    <nav class="nav" id="workNav" hidden>
      <a class="nav__item" data-nav="dashboard" href="#" title="대시보드">
        <span class="nav__icon">🕸️</span> <span class="nav__label">대시보드</span>
      </a>
      <a class="nav__item" data-nav="manuscript" href="#" title="원고">
        <span class="nav__icon">📖</span> <span class="nav__label">원고</span>
      </a>
      <a class="nav__item" data-nav="characters" href="#" title="캐릭터">
        <span class="nav__icon">🧑‍🤝‍🧑</span> <span class="nav__label">캐릭터</span>
      </a>
      <a class="nav__item" data-nav="settings" href="#" title="설정 노트">
        <span class="nav__icon">🗺️</span> <span class="nav__label">설정 노트</span>
      </a>
      <a class="nav__item" data-nav="inbox" href="#" title="메모 인박스">
        <span class="nav__icon">📥</span> <span class="nav__label">메모 인박스</span>
      </a>
      <a class="nav__item" data-nav="research" href="#" title="자료 수집">
        <span class="nav__icon">📎</span> <span class="nav__label">자료 수집</span>
      </a>
      <a class="nav__item" data-nav="goals" href="#" title="목표 & 일정">
        <span class="nav__icon">🎯</span> <span class="nav__label">목표 &amp; 일정</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <button class="btn btn--ghost btn--block" id="globalSearchBtn" title="통합 검색"><span class="btn__icon">🔍</span> <span class="btn__label">통합 검색</span> <span class="kbd">Ctrl K</span></button>
      <button class="btn btn--ghost btn--block" id="timerBtn" title="타이머"><span class="btn__icon">⏱</span> <span class="btn__label">타이머</span></button>
      <button class="btn btn--ghost btn--block" id="settingsBtn" title="설정"><span class="btn__icon">⚙</span> <span class="btn__label">설정</span></button>
    </div>
  </aside>

  <main class="content" id="content">
    <!-- view injected here -->
  </main>
</div>

<!-- Modal root -->
<div id="modalRoot"></div>
<!-- Toast root -->
<div id="toastRoot" class="toast-root"></div>

<script src="js/utils.js"></script>
<script src="js/prefs.js"></script>
<script src="js/theme.js"></script>
<script src="js/db.js"></script>
<script src="js/models.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script src="js/graph.js"></script>
<script src="js/richEditor.js"></script>
<script src="js/proofreaderRules.js"></script>
<script src="js/proofreader.js"></script>
<script src="js/memoCanvas.js"></script>
<script src="js/timer.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/zipWriter.js"></script>
<script src="js/docxWriter.js"></script>
<script src="js/views/home.js"></script>
<script src="js/manuscriptExport.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/manuscript.js"></script>
<script src="js/views/characters.js"></script>
<script src="js/views/settingNotes.js"></script>
<script src="js/views/inbox.js"></script>
<script src="js/views/research.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/searchView.js"></script>
<script src="js/views/settingsPanel.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
